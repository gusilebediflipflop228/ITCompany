spring:
  application:
    name: ITCompany

  datasource:
    url: jdbc:postgresql://localhost:5432/project_manager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
     user:
       name: admin
       password: admin123
       roles: USER

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: IT Company API
    description: REST API для управления проектами и сотрудниками
    version: 1.0.0
    java-version: ${java.version}
    spring-boot-version: ${spring-boot.version}
  author:
    name: TimbaTumba
    group: 2sem
    effective: java


server:
  port: 8080

logging:
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha